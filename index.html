  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="icon"
      type="image/jpeg"
      href="/TeksType.jpeg"
    />

    <title>Typing Test in Hindi, English & Arabic | TypePerfectly</title>

    <meta
      name="description"
      content="Take a free online typing test on TypePerfectly. Practice Hindi, English, Arabic, Hinglish, code and business typing with live WPM, accuracy and instant results."
    />

    <link
      rel="canonical"
      href="https://www.typeperfectly.com/"
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#7c4dff" />

    <!-- Facebook, WhatsApp and LinkedIn sharing -->
    <meta
      property="og:title"
      content="Typing Test in Hindi, English & Arabic | TypePerfectly"
    />

    <meta
      property="og:description"
      content="Test your typing speed and practice Hindi, English, Arabic, Hinglish, code and business typing."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://www.typeperfectly.com/"
    />

    <meta
      property="og:image"
      content="https://www.typeperfectly.com/TeksType.jpeg"
    />

    <meta
      property="og:site_name"
      content="TypePerfectly"
    />

    <!-- X and Twitter sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Typing Test in Hindi, English & Arabic | TypePerfectly"
    />

    <meta
      name="twitter:description"
      content="Check your WPM and accuracy with free Hindi, English, Arabic and Hinglish typing tests."
    />

    <meta
      name="twitter:image"
      content="https://www.typeperfectly.com/TeksType.jpeg"
    />

    <!-- Software application schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TypePerfectly",
        "url": "https://www.typeperfectly.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "A free online typing speed test and typing practice application with live WPM and accuracy tracking for English, Hindi, Arabic, Hinglish, code and business typing.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- FAQ schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is the multilingual typing test free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can take typing tests and practice for free without creating an account."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account to check my WPM?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. An account is optional and is only used to save typing progress and results."
            }
          },
          {
            "@type": "Question",
            "name": "How is typing speed calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Typing speed is calculated by dividing correctly typed characters by five and then dividing that number by the total typing time in minutes."
            }
          },
          {
            "@type": "Question",
            "name": "Which typing languages and modes are available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TypePerfectly supports English, Hindi, Arabic, Hinglish, code, business, conversation, bigrams, trigrams and custom typing practice."
            }
          }
        ]
      }
    </script>

    <!-- Google Analytics -->
    <script
